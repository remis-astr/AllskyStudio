<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle — night sky -->
  <circle cx="64" cy="64" r="62" fill="#0a0e1a" stroke="#2a3a5c" stroke-width="3"/>

  <!-- Milky Way glow -->
  <ellipse cx="64" cy="64" rx="44" ry="18" fill="none" stroke="#3a5080" stroke-width="12" opacity="0.35" transform="rotate(-30 64 64)"/>

  <!-- Stars -->
  <circle cx="30" cy="28" r="1.8" fill="white" opacity="0.95"/>
  <circle cx="52" cy="18" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="78" cy="22" r="2.2" fill="white" opacity="1"/>
  <circle cx="98" cy="32" r="1.5" fill="white" opacity="0.85"/>
  <circle cx="110" cy="52" r="1.2" fill="white" opacity="0.7"/>
  <circle cx="105" cy="78" r="1.8" fill="white" opacity="0.9"/>
  <circle cx="88" cy="100" r="1.3" fill="white" opacity="0.75"/>
  <circle cx="62" cy="108" r="1.6" fill="white" opacity="0.85"/>
  <circle cx="38" cy="102" r="1.2" fill="white" opacity="0.7"/>
  <circle cx="18" cy="80" r="1.9" fill="white" opacity="0.9"/>
  <circle cx="14" cy="54" r="1.3" fill="white" opacity="0.75"/>
  <circle cx="42" cy="44" r="1.0" fill="white" opacity="0.65"/>
  <circle cx="70" cy="38" r="1.5" fill="#aac8ff" opacity="0.9"/>
  <circle cx="90" cy="55" r="1.0" fill="white" opacity="0.6"/>
  <circle cx="84" cy="72" r="1.2" fill="#ffd080" opacity="0.85"/>
  <circle cx="48" cy="72" r="1.0" fill="white" opacity="0.7"/>
  <circle cx="56" cy="88" r="1.3" fill="white" opacity="0.65"/>

  <!-- Fisheye lens ring -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="#4a7abf" stroke-width="1.5" opacity="0.5"/>
  <circle cx="64" cy="64" r="38" fill="none" stroke="#3a5a8f" stroke-width="1" opacity="0.35"/>

  <!-- Camera body hint at bottom -->
  <rect x="46" y="96" width="36" height="10" rx="3" fill="#1e2d45" stroke="#4a7abf" stroke-width="1.2" opacity="0.9"/>
  <circle cx="64" cy="101" r="3" fill="#4a7abf" opacity="0.7"/>

  <!-- Outer ring highlight -->
  <circle cx="64" cy="64" r="62" fill="none" stroke="#6a9ad0" stroke-width="1" opacity="0.4"/>
</svg>
